<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>AegisKeys - AI API Vault</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #0b0d12;
    --panel: #13161d;
    --panel-2: #1a1e27;
    --panel-3: #222733;
    --border: #2a2f3a;
    --border-focus: #4a5568;
    --text: #e2e8f0;
    --text-dim: #94a3b8;
    --text-muted: #64748b;
    --accent: #10b981;
    --accent-hover: #059669;
    --blue: #3b82f6;
    --red: #ef4444;
    --yellow: #f59e0b;
    --radius: 10px;
    --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.2);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; line-height: 1.5; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, textarea, select { font-family: inherit; color: inherit; }
  a { color: var(--blue); text-decoration: none; }

  /* Animations */
  @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
  .fade-in { animation: fadeIn 0.3s ease-out; }

  /* Layout */
  .app { display: grid; grid-template-columns: 320px 1fr; height: 100vh; }
  .sidebar { background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  .main { display: flex; flex-direction: column; overflow: hidden; }

  /* Header */
  .header { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--border); background: var(--panel); z-index: 10; }
  .logo-text { font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  .logo-text .shield { font-size: 20px; }
  .spacer { flex: 1; }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border-radius: 6px; font-size: 13px; font-weight: 500; border: 1px solid var(--border); background: var(--panel-2); color: var(--text); transition: all 0.15s; white-space: nowrap; }
  .btn:hover { background: var(--panel-3); border-color: var(--border-focus); }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn.danger { color: var(--red); border-color: transparent; background: transparent; }
  .btn.danger:hover { background: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.3); }
  .btn.ghost { border-color: transparent; background: transparent; }
  .btn.ghost:hover { background: var(--panel-3); }
  .btn.icon { padding: 8px; width: 34px; height: 34px; }
  .btn .spinner { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; }

  /* Sidebar */
  .side-top { padding: 16px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 12px; }
  .search-box { position: relative; }
  .search-box input { width: 100%; background: var(--panel-2); border: 1px solid var(--border); padding: 9px 12px 9px 36px; border-radius: 6px; outline: none; font-size: 13px; transition: border 0.2s; }
  .search-box input:focus { border-color: var(--accent); }
  .search-box svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
  .list { flex: 1; overflow-y: auto; padding: 8px; }
  .list-item { padding: 10px 12px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 12px; border: 1px solid transparent; margin-bottom: 4px; transition: all 0.15s; }
  .list-item:hover { background: var(--panel-2); }
  .list-item.active { background: var(--panel-2); border-color: var(--border-focus); }
  .item-icon { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; font-weight: 700; color: #fff; font-size: 14px; flex-shrink: 0; }
  .item-info { flex: 1; min-width: 0; }
  .item-name { font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-sub { font-size: 11.5px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-status { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
  .item-status.off { background: var(--text-muted); }
  .empty-state { padding: 40px 20px; text-align: center; color: var(--text-muted); font-size: 13px; }

  /* Main Content */
  .content { flex: 1; overflow-y: auto; padding: 24px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; animation: fadeIn 0.3s ease-out; }
  .card h3 { font-size: 15px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; color: var(--text); }
  
  /* Forms */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field.full { grid-column: 1 / -1; }
  .field label { font-size: 12px; color: var(--text-dim); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .field input, .field textarea, .field select {
    background: var(--panel-2); border: 1px solid var(--border); padding: 10px 12px; border-radius: 6px; outline: none; font-size: 13.5px; transition: border 0.2s;
  }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); }
  .field input.error, .field textarea.error { border-color: var(--red); }
  .field .error-msg { color: var(--red); font-size: 12px; display: none; }
  .field .error-msg.show { display: block; }
  .field textarea { min-height: 80px; resize: vertical; font-family: var(--mono); font-size: 12.5px; }
  .field .hint { font-size: 11.5px; color: var(--text-muted); }

  .input-group { display: flex; gap: 8px; }
  .input-group input { flex: 1; font-family: var(--mono); }

  /* Edit Banner */
  .edit-banner { background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.3); color: var(--yellow); padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 500; }

  /* View Details */
  .view-head { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
  .view-head .icon-lg { width: 56px; height: 56px; border-radius: 12px; display: grid; place-items: center; font-weight: 800; font-size: 22px; color: #fff; }
  .view-head h2 { font-size: 20px; margin-bottom: 2px; }
  .view-head .sub { color: var(--text-muted); font-size: 13px; }
  
  .kv-grid { display: grid; grid-template-columns: 140px 1fr; gap: 12px 20px; font-size: 13.5px; }
  .kv-grid .k { color: var(--text-muted); font-weight: 500; }
  .kv-grid .v { font-family: var(--mono); word-break: break-all; color: var(--text); }
  .kv-grid .v.text { font-family: inherit; }

  .code-block { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 16px; font-family: var(--mono); font-size: 12.5px; color: var(--text-dim); white-space: pre-wrap; word-break: break-all; position: relative; line-height: 1.6; }
  .code-block .copy-btn { position: absolute; top: 8px; right: 8px; }

  /* Test Result */
  .test-result { margin-top: 16px; border-radius: 8px; padding: 16px; border: 1px solid var(--border); }
  .test-result.success { background: rgba(16, 185, 129, 0.05); border-color: rgba(16, 185, 129, 0.3); }
  .test-result.error { background: rgba(239, 68, 68, 0.05); border-color: rgba(239, 68, 68, 0.3); }
  .test-result h4 { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 14px; }
  .test-result.success h4 { color: var(--accent); }
  .test-result.error h4 { color: var(--red); }
  .test-result pre { font-family: var(--mono); font-size: 12px; color: var(--text-dim); white-space: pre-wrap; margin-top: 8px; max-height: 150px; overflow-y: auto; }

  /* Lock Screen */
  .lock-screen { position: fixed; inset: 0; background: radial-gradient(circle at top right, #1a2235, var(--bg)); display: flex; align-items: center; justify-content: center; z-index: 2000; }
  .lock-box { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 32px; width: 400px; max-width: 90vw; box-shadow: var(--shadow); }
  .lock-box .logo-center { text-align: center; margin-bottom: 24px; }
  .lock-box .logo-center .shield { font-size: 48px; display: block; margin-bottom: 8px; }
  .lock-box h2 { text-align: center; margin-bottom: 8px; font-size: 22px; }
  .lock-box .subtitle { text-align: center; color: var(--text-muted); font-size: 13.5px; margin-bottom: 24px; }
  .lock-box .field { margin-bottom: 16px; }
  .lock-box .actions { display: flex; gap: 12px; margin-top: 24px; }
  .lock-box .actions .btn { flex: 1; padding: 10px; }
  .lock-error { color: var(--red); font-size: 13px; text-align: center; margin-top: 12px; min-height: 20px; font-weight: 500; }
  .pwd-toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); cursor: pointer; }
  .pwd-toggle:hover { color: var(--text); }

  /* Modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 1000; }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 24px; width: 420px; max-width: 90vw; box-shadow: var(--shadow); animation: fadeIn 0.2s ease-out; }
  .modal h3 { margin-bottom: 8px; font-size: 18px; }
  .modal p { color: var(--text-dim); font-size: 14px; margin-bottom: 20px; line-height: 1.6; }
  .modal .actions { display: flex; gap: 12px; justify-content: flex-end; }

  /* Toast */
  .toast-container { position: fixed; bottom: 24px; right: 24px; display: flex; flex-direction: column; gap: 10px; z-index: 3000; pointer-events: none; }
  .toast { background: var(--panel-2); border: 1px solid var(--border); padding: 12px 16px; border-radius: 8px; font-size: 13px; display: flex; align-items: center; gap: 10px; box-shadow: var(--shadow); animation: fadeIn 0.3s ease-out; pointer-events: auto; max-width: 350px; }
  .toast.success { border-left: 4px solid var(--accent); }
  .toast.error { border-left: 4px solid var(--red); }
  .toast.warning { border-left: 4px solid var(--yellow); }
  .toast.info { border-left: 4px solid var(--blue); }
  .toast .icon { font-size: 16px; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--panel-3); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-focus); }

  @media (max-width: 768px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { max-height: 40vh; border-right: none; border-bottom: 1px solid var(--border); }
    .form-grid { grid-template-columns: 1fr; }
    .kv-grid { grid-template-columns: 1fr; gap: 4px 0; }
    .kv-grid .k { margin-top: 8px; }
  }
</style>
</head>
<body>

<!-- LOCK SCREEN -->
<div class="lock-screen" id="lockScreen">
  <div class="lock-box">
    <div class="logo-center">
      <span class="shield">🛡️</span>
      <h2>AegisKeys</h2>
      <p class="subtitle">Secure AI API Token Vault</p>
    </div>
    
    <div class="field" style="position: relative;">
      <label>Master Password</label>
      <input type="password" id="masterPwd" placeholder="Enter your master password" autocomplete="off" />
      <span class="pwd-toggle" id="pwdToggle">👁️</span>
    </div>
    
    <div class="lock-error" id="lockError"></div>

    <div class="actions">
      <button class="btn" id="btnLoadFile">📂 Load File</button>
      <button class="btn primary" id="btnUnlock">Unlock</button>
    </div>
    
    <div style="text-align: center; margin-top: 20px;">
      <button class="btn ghost" id="btnNewVault" style="font-size: 12px; color: var(--text-muted);">No vault yet? Create a new one</button>
    </div>
  </div>
</div>

<!-- MAIN APP -->
<div class="app" id="app" style="display:none;">
  <aside class="sidebar">
    <div class="header">
      <div class="logo-text"><span class="shield">🛡️</span> AegisKeys</div>
      <div class="spacer"></div>
      <button class="btn icon ghost" id="btnLock" title="Lock Vault">🔒</button>
    </div>
    <div class="side-top">
      <button class="btn primary" id="btnNew" style="width: 100%;">+ New API Key</button>
      <div class="search-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="searchInput" placeholder="Search keys..." />
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-muted);">
        <span id="countLabel">0 keys</span>
        <button class="btn icon ghost" id="btnExport" title="Save Vault" style="width: auto; padding: 4px 8px; font-size: 12px;">💾 Save</button>
      </div>
    </div>
    <div class="list" id="list"></div>
  </aside>

  <main class="main">
    <div class="header">
      <div class="logo-text" id="mainTitle">Select a Key</div>
      <div class="spacer"></div>
      <div id="mainActions" style="display: none; gap: 8px;">
        <button class="btn" id="btnTest">🧪 Test</button>
        <button class="btn" id="btnEdit">✏️ Edit</button>
        <button class="btn danger" id="btnDelete">🗑 Delete</button>
      </div>
    </div>
    <div class="content" id="content">
      <div class="card fade-in" style="text-align: center; padding: 60px 20px;">
        <h3 style="justify-content: center; font-size: 18px;">Welcome to AegisKeys</h3>
        <p style="color: var(--text-muted); max-width: 400px; margin: 0 auto;">Select an API key from the sidebar to view details, or click <b>+ New API Key</b> to add your first credential.</p>
      </div>
    </div>
  </main>
</div>

<!-- MODALS -->
<div class="modal-overlay" id="modalConfirm">
  <div class="modal">
    <h3 id="confirmTitle">Confirm Action</h3>
    <p id="confirmMsg">Are you sure?</p>
    <div class="actions">
      <button class="btn" id="confirmCancel">Cancel</button>
      <button class="btn primary" id="confirmOk">Confirm</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalError">
  <div class="modal">
    <h3 style="color: var(--red);">⚠️ Error</h3>
    <p id="errorMsg">Something went wrong.</p>
    <div class="actions">
      <button class="btn primary" id="errorOk">Understood</button>
    </div>
  </div>
</div>

<!-- TOASTS -->
<div class="toast-container" id="toastContainer"></div>

<!-- HIDDEN INPUTS -->
<input type="file" id="fileInput" accept=".json" style="display:none" />

<script>
/* =========================================================
   AEGISKEYS - CORE LOGIC
   ========================================================= */

const STATE = {
  vault: { entries: [] },
  currentId: null,
  editingId: null,
  isUnlocked: false,
  autoLockTimer: null
};

const AUTO_LOCK_MS = 5 * 60 * 1000;

/* ---------- CRYPTO ---------- */
const enc = new TextEncoder();
const dec = new TextDecoder();

async function deriveKey(password, salt) {
  const baseKey = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: 250000, hash: 'SHA-256' },
    baseKey, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
  );
}

async function encryptData(obj, password) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(password, salt);
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(JSON.stringify(obj)));
  return { v: 1, salt: b64(salt), iv: b64(iv), ct: b64(new Uint8Array(ct)) };
}

async function decryptData(payload, password) {
  const salt = b64d(payload.salt), iv = b64d(payload.iv), ct = b64d(payload.ct);
  const key = await deriveKey(password, salt);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
  return JSON.parse(dec.decode(pt));
}

function b64(u8) { return btoa(String.fromCharCode(...u8)); }
function b64d(s) { return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }

/* ---------- UTILS ---------- */
const $ = id => document.getElementById(id);
const uid = () => 'id_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
const now = () => new Date().toISOString();
const esc = s => (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function getColor(name) {
  const n = (name || '').toLowerCase();
  if (n.includes('openai')) return '#10a37f';
  if (n.includes('anthropic') || n.includes('claude')) return '#d97757';
  if (n.includes('google') || n.includes('gemini')) return '#4285f4';
  if (n.includes('mistral')) return '#fa520f';
  if (n.includes('groq')) return '#f55036';
  if (n.includes('deepseek')) return '#5b6efc';
  const colors = ['#8b5cf6', '#ec4899', '#06b6d4', '#84cc16', '#f97316'];
  let h = 0; for (const c of name || '') h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return colors[h % colors.length];
}

function getInitials(name) {
  return (name || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
}

function maskToken(t) {
  if (!t) return '';
  if (t.length <= 8) return '•'.repeat(t.length);
  return t.slice(0, 4) + '•'.repeat(Math.max(6, t.length - 8)) + t.slice(-4);
}

/* ---------- UI FEEDBACK ---------- */
function toast(msg, type = 'info') {
  const container = $('toastContainer');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
  el.innerHTML = `<span class="icon">${icons[type]}</span> <span>${esc(msg)}</span>`;
  container.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 3500);
}

function showModal(title, msg, onOk, okText = 'Confirm', isDanger = false) {
  $('confirmTitle').textContent = title;
  $('confirmMsg').innerHTML = msg;
  const okBtn = $('confirmOk');
  okBtn.textContent = okText;
  okBtn.className = isDanger ? 'btn danger' : 'btn primary';
  $('modalConfirm').classList.add('show');
  
  const cleanup = () => {
    $('modalConfirm').classList.remove('show');
    okBtn.replaceWith(okBtn.cloneNode(true)); // remove listeners
    $('confirmCancel').replaceWith($('confirmCancel').cloneNode(true));
  };
  
  $('confirmOk').onclick = () => { cleanup(); onOk(); };
  $('confirmCancel').onclick = cleanup;
}

function showErrorModal(msg) {
  $('errorMsg').innerHTML = msg;
  $('modalError').classList.add('show');
  $('errorOk').onclick = () => $('modalError').classList.remove('show');
}

/* ---------- LOCK / UNLOCK ---------- */
$('pwdToggle').onclick = () => {
  const inp = $('masterPwd');
  inp.type = inp.type === 'password' ? 'text' : 'password';
  $('pwdToggle').textContent = inp.type === 'password' ? '👁️' : '🙈';
};

$('btnUnlock').onclick = tryUnlock;
$('masterPwd').onkeydown = e => { if (e.key === 'Enter') tryUnlock(); };

async function tryUnlock() {
  const pwd = $('masterPwd').value;
  const errEl = $('lockError');
  const btn = $('btnUnlock');
  
  if (!pwd) {
    errEl.textContent = 'Please enter your master password.';
    $('masterPwd').classList.add('shake', 'error');
    setTimeout(() => $('masterPwd').classList.remove('shake', 'error'), 500);
    return;
  }

  const raw = sessionStorage.getItem('__vault_payload__');
  if (!raw) {
    errEl.textContent = 'No vault file loaded. Click "Load File" or create a new vault.';
    $('masterPwd').classList.add('shake');
    setTimeout(() => $('masterPwd').classList.remove('shake'), 500);
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Decrypting...';
  errEl.textContent = '';

  try {
    const payload = JSON.parse(raw);
    STATE.vault = await decryptData(payload, pwd);
    if (!STATE.vault.entries) STATE.vault.entries = [];
    sessionStorage.setItem('__pwd__', pwd);
    STATE.isUnlocked = true;
    enterApp();
    toast('Vault unlocked successfully', 'success');
  } catch (err) {
    errEl.textContent = 'Incorrect password or corrupted file. Please try again.';
    $('masterPwd').classList.add('shake', 'error');
    $('masterPwd').value = '';
    $('masterPwd').focus();
    setTimeout(() => {
      $('masterPwd').classList.remove('shake', 'error');
      btn.disabled = false;
      btn.innerHTML = 'Unlock';
    }, 1500);
  }
}

$('btnNewVault').onclick = () => {
  const pwd = $('masterPwd').value;
  if (pwd.length < 6) {
    $('lockError').textContent = 'Password must be at least 6 characters to create a vault.';
    $('masterPwd').classList.add('shake');
    setTimeout(() => $('masterPwd').classList.remove('shake'), 500);
    return;
  }
  STATE.vault = { entries: [] };
  sessionStorage.setItem('__pwd__', pwd);
  STATE.isUnlocked = true;
  enterApp();
  toast('New vault created. Remember to click Save!', 'success');
};

$('btnLoadFile').onclick = () => $('fileInput').click();
$('fileInput').onchange = async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const text = await file.text();
    const payload = JSON.parse(text);
    if (!payload.ct || !payload.iv || !payload.salt) throw new Error('Invalid structure');
    sessionStorage.setItem('__vault_payload__', text);
    $('lockError').textContent = '';
    $('lockError').style.color = 'var(--accent)';
    $('lockError').textContent = `✓ Loaded "${file.name}". Enter password to unlock.`;
    $('masterPwd').focus();
    toast('Vault file loaded', 'success');
  } catch (err) {
    showErrorModal('The selected file is not a valid AegisKeys vault file.<br><br>It might be corrupted or from a different application.');
  }
  e.target.value = '';
};

function enterApp() {
  $('lockScreen').style.display = 'none';
  $('app').style.display = 'grid';
  renderList();
  resetAutoLock();
}

$('btnLock').onclick = lockVault;
function lockVault() {
  sessionStorage.removeItem('__pwd__');
  sessionStorage.removeItem('__vault_payload__');
  STATE.isUnlocked = false;
  STATE.vault = { entries: [] };
  STATE.currentId = null;
  STATE.editingId = null;
  $('app').style.display = 'none';
  $('lockScreen').style.display = 'flex';
  $('masterPwd').value = '';
  $('lockError').textContent = '';
  $('lockError').style.color = 'var(--red)';
  toast('Vault locked', 'info');
}

function resetAutoLock() {
  clearTimeout(STATE.autoLockTimer);
  STATE.autoLockTimer = setTimeout(() => {
    if (STATE.isUnlocked) { toast('Auto-locked due to inactivity', 'warning'); lockVault(); }
  }, AUTO_LOCK_MS);
}
['mousemove','keydown','click'].forEach(ev => document.addEventListener(ev, () => { if (STATE.isUnlocked) resetAutoLock(); }));

/* ---------- RENDER LIST ---------- */
function renderList() {
  const q = $('searchInput').value.toLowerCase();
  const list = $('list');
  const filtered = STATE.vault.entries.filter(e => 
    !q || (e.name + ' ' + e.baseUrl + ' ' + (e.tags||[]).join(' ')).toLowerCase().includes(q)
  );
  
  $('countLabel').textContent = `${STATE.vault.entries.length} key${STATE.vault.entries.length !== 1 ? 's' : ''}`;
  
  if (!filtered.length) {
    list.innerHTML = `<div class="empty-state">${STATE.vault.entries.length ? 'No matches found' : 'No keys yet. Click "+ New API Key" to start.'}</div>`;
    return;
  }

  list.innerHTML = filtered.map(e => `
    <div class="list-item ${e.id === STATE.currentId ? 'active' : ''}" data-id="${e.id}">
      <div class="item-icon" style="background:${getColor(e.name)}">${esc(getInitials(e.name))}</div>
      <div class="item-info">
        <div class="item-name">${esc(e.name)}</div>
        <div class="item-sub">${esc(e.provider || 'Custom')} ${e.model ? '· ' + esc(e.model) : ''}</div>
      </div>
      <div class="item-status ${e.disabled ? 'off' : ''}" title="${e.disabled ? 'Disabled' : 'Active'}"></div>
    </div>
  `).join('');

  list.querySelectorAll('.list-item').forEach(el => {
    el.onclick = () => {
      STATE.currentId = el.dataset.id;
      STATE.editingId = null;
      renderList();
      renderMain();
    };
  });
}
$('searchInput').oninput = renderList;

/* ---------- RENDER MAIN ---------- */
function renderMain() {
  const title = $('mainTitle');
  const content = $('content');
  const actions = $('mainActions');

  if (STATE.editingId) {
    renderForm();
    return;
  }

  if (!STATE.currentId) {
    title.textContent = 'Select a Key';
    actions.style.display = 'none';
    content.innerHTML = `<div class="card fade-in" style="text-align: center; padding: 60px 20px;">
      <h3 style="justify-content: center; font-size: 18px;">Welcome to AegisKeys</h3>
      <p style="color: var(--text-muted); max-width: 400px; margin: 0 auto;">Select an API key from the sidebar to view details, or click <b>+ New API Key</b> to add your first credential.</p>
    </div>`;
    return;
  }

  const e = STATE.vault.entries.find(x => x.id === STATE.currentId);
  if (!e) { STATE.currentId = null; renderMain(); return; }

  title.textContent = e.name;
  actions.style.display = 'flex';

  const curl = buildCurl(e);

  content.innerHTML = `
    <div class="card fade-in">
      <div class="view-head">
        <div class="icon-lg" style="background:${getColor(e.name)}">${esc(getInitials(e.name))}</div>
        <div>
          <h2>${esc(e.name)}</h2>
          <div class="sub">${esc(e.provider || 'Custom Provider')} ${e.model ? '· ' + esc(e.model) : ''}</div>
        </div>
        <div style="margin-left:auto;">
          <span class="btn ${e.disabled ? '' : 'primary'}" style="pointer-events:none; font-size:12px; padding: 4px 10px;">
            ${e.disabled ? 'Disabled' : 'Active'}
          </span>
        </div>
      </div>
      
      <div class="kv-grid">
        <div class="k">Base URL</div>
        <div class="v text">${esc(e.baseUrl)}</div>
        
        <div class="k">API Token</div>
        <div class="v">
          <div class="input-group">
            <input type="password" id="viewToken" value="${esc(e.token)}" readonly />
            <button class="btn" id="btnReveal">Show</button>
            <button class="btn" id="btnCopyToken">Copy</button>
          </div>
          <div class="hint">Masked: <code>${esc(maskToken(e.token))}</code></div>
        </div>

        <div class="k">Auth Header</div>
        <div class="v text">${esc(e.authHeader || 'Authorization: Bearer <token>')}</div>
      </div>
    </div>

    <div class="card fade-in">
      <h3>⚡ Quick Use</h3>
      <div style="display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap;">
        <button class="btn" id="btnCopyCurl">📋 Copy cURL</button>
        <button class="btn" id="btnCopyHeader">📋 Copy Auth Header</button>
      </div>
      <div class="code-block">
        <button class="btn icon ghost copy-btn" id="btnCopyCurl2">📋</button>
        ${esc(curl)}
      </div>
      <div id="testResultArea"></div>
    </div>

    ${e.notes ? `
    <div class="card fade-in">
      <h3>📝 Notes</h3>
      <div style="color: var(--text-dim); white-space: pre-wrap;">${esc(e.notes)}</div>
    </div>` : ''}
  `;

  // Bind View Events
  const viewToken = $('viewToken');
  $('btnReveal').onclick = () => {
    if (viewToken.type === 'password') {
      viewToken.type = 'text';
      $('btnReveal').textContent = 'Hide';
      setTimeout(() => { viewToken.type = 'password'; $('btnReveal').textContent = 'Show'; }, 10000);
    } else {
      viewToken.type = 'password';
      $('btnReveal').textContent = 'Show';
    }
  };

  $('btnCopyToken').onclick = () => copyToClipboard(e.token, 'Token copied (clears in 30s)');
  $('btnCopyCurl').onclick = $('btnCopyCurl2').onclick = () => copyToClipboard(curl, 'cURL command copied');
  $('btnCopyHeader').onclick = () => {
    const h = (e.authHeader || 'Authorization: Bearer <token>').replace('<token>', e.token);
    copyToClipboard(h, 'Auth header copied');
  };
}

function buildCurl(e) {
  if (!e.baseUrl) return '# No base URL';
  const auth = (e.authHeader || 'Authorization: Bearer <token>').replace('<token>', e.token);
  let body = '';
  if (e.model) {
    body = ` \\\n  -d '{"model":"${e.model}","messages":[{"role":"user","content":"Hi"}]}'`;
  }
  return `curl "${e.baseUrl}" \\\n  -H "${auth}" \\\n  -H "Content-Type: application/json"${body}`;
}

/* ---------- FORM (CREATE / EDIT) ---------- */
function renderForm() {
  const isNew = STATE.editingId === '__new__';
  const e = isNew ? getEmptyEntry() : STATE.vault.entries.find(x => x.id === STATE.editingId);
  
  $('mainTitle').textContent = isNew ? 'New API Key' : `Edit: ${e.name}`;
  $('mainActions').style.display = 'none';

  const banner = isNew ? '' : `
    <div class="edit-banner">
      ⚠️ You are editing <b>${esc(e.name)}</b>. Saving will overwrite the existing configuration.
    </div>
  `;

  $('content').innerHTML = `
    ${banner}
    <div class="card fade-in">
      <h3>🔑 Credentials</h3>
      <div class="form-grid">
        <div class="field">
          <label>Name *</label>
          <input type="text" id="f_name" value="${esc(e.name)}" placeholder="e.g. OpenAI Prod" />
          <div class="error-msg" id="err_name">Name is required</div>
        </div>
        <div class="field">
          <label>Provider</label>
          <input type="text" id="f_provider" value="${esc(e.provider)}" placeholder="OpenAI, Anthropic..." />
        </div>
        <div class="field full">
          <label>Base URL *</label>
          <input type="url" id="f_baseUrl" value="${esc(e.baseUrl)}" placeholder="https://api.openai.com/v1" />
          <div class="error-msg" id="err_baseUrl">Valid URL is required</div>
        </div>
        <div class="field full">
          <label>API Token *</label>
          <div class="input-group">
            <input type="password" id="f_token" value="${esc(e.token)}" placeholder="sk-..." />
            <button class="btn" id="f_toggle">Show</button>
          </div>
          <div class="error-msg" id="err_token">Token is required</div>
        </div>
        <div class="field">
          <label>Default Model</label>
          <input type="text" id="f_model" value="${esc(e.model)}" placeholder="gpt-4o" />
        </div>
        <div class="field">
          <label>Auth Header</label>
          <input type="text" id="f_auth" value="${esc(e.authHeader || 'Authorization: Bearer <token>')}" />
          <div class="hint">Use &lt;token&gt; as placeholder</div>
        </div>
      </div>
    </div>

    <div class="card fade-in">
      <h3>📝 Additional Info</h3>
      <div class="field full">
        <label>Notes</label>
        <textarea id="f_notes" placeholder="Rate limits, usage notes...">${esc(e.notes)}</textarea>
      </div>
      <div class="field" style="margin-top: 16px;">
        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; text-transform: none; font-size: 14px; color: var(--text);">
          <input type="checkbox" id="f_disabled" ${e.disabled ? 'checked' : ''} />
          Disable this key (keep in vault but mark as inactive)
        </label>
      </div>
    </div>

    <div style="display: flex; gap: 12px; justify-content: flex-end; margin-bottom: 40px;">
      <button class="btn" id="f_cancel">Cancel</button>
      <button class="btn primary" id="f_save">💾 Save Key</button>
    </div>
  `;

  // Bind Form Events
  $('f_toggle').onclick = () => {
    const inp = $('f_token');
    inp.type = inp.type === 'password' ? 'text' : 'password';
    $('f_toggle').textContent = inp.type === 'password' ? 'Show' : 'Hide';
  };

  $('f_cancel').onclick = () => {
    STATE.editingId = null;
    if (isNew) STATE.currentId = null;
    renderList();
    renderMain();
  };

  $('f_save').onclick = () => saveEntry(isNew, e);
}

function getEmptyEntry() {
  return { id: '__new__', name: '', provider: '', baseUrl: '', token: '', model: '', authHeader: 'Authorization: Bearer <token>', notes: '', disabled: false, createdAt: now(), lastUsedAt: null, copyCount: 0 };
}

function saveEntry(isNew, original) {
  // Validate
  let hasError = false;
  const name = $('f_name').value.trim();
  const baseUrl = $('f_baseUrl').value.trim();
  const token = $('f_token').value.trim();

  if (!name) { $('f_name').classList.add('error'); $('err_name').classList.add('show'); hasError = true; } 
  else { $('f_name').classList.remove('error'); $('err_name').classList.remove('show'); }

  if (!baseUrl || !baseUrl.startsWith('http')) { $('f_baseUrl').classList.add('error'); $('err_baseUrl').classList.add('show'); hasError = true; }
  else { $('f_baseUrl').classList.remove('error'); $('err_baseUrl').classList.remove('show'); }

  if (!token) { $('f_token').classList.add('error'); $('err_token').classList.add('show'); hasError = true; }
  else { $('f_token').classList.remove('error'); $('err_token').classList.remove('show'); }

  if (hasError) {
    toast('Please fix the errors in the form', 'error');
    return;
  }

  const doSave = () => {
    const data = {
      id: isNew ? uid() : STATE.editingId,
      name,
      provider: $('f_provider').value.trim(),
      baseUrl,
      token,
      model: $('f_model').value.trim(),
      authHeader: $('f_auth').value.trim() || 'Authorization: Bearer <token>',
      notes: $('f_notes').value,
      disabled: $('f_disabled').checked,
      createdAt: original.createdAt || now(),
      lastUsedAt: original.lastUsedAt,
      copyCount: original.copyCount || 0
    };

    if (isNew) STATE.vault.entries.unshift(data);
    else Object.assign(STATE.vault.entries.find(x => x.id === STATE.editingId), data);

    STATE.currentId = data.id;
    STATE.editingId = null;
    renderList();
    renderMain();
    toast(isNew ? 'API key added successfully' : 'Changes saved successfully', 'success');
  };

  // Double check for editing
  if (!isNew) {
    showModal(
      'Save Changes?',
      `Are you sure you want to overwrite the configuration for <b>${esc(original.name)}</b>?`,
      doSave,
      'Save Changes'
    );
  } else {
    doSave();
  }
}

/* ---------- ACTIONS ---------- */
$('btnNew').onclick = () => {
  STATE.editingId = '__new__';
  STATE.currentId = null;
  renderList();
  renderMain();
};

$('btnEdit').onclick = () => {
  if (!STATE.currentId) return;
  STATE.editingId = STATE.currentId;
  renderMain();
};

$('btnDelete').onclick = () => {
  const e = STATE.vault.entries.find(x => x.id === STATE.currentId);
  if (!e) return;
  showModal(
    'Delete API Key?',
    `Are you sure you want to permanently delete <b>${esc(e.name)}</b>? This action cannot be undone.`,
    () => {
      STATE.vault.entries = STATE.vault.entries.filter(x => x.id !== STATE.currentId);
      STATE.currentId = null;
      renderList();
      renderMain();
      toast('API key deleted', 'success');
    },
    'Delete',
    true
  );
};

$('btnExport').onclick = async () => {
  const pwd = sessionStorage.getItem('__pwd__');
  if (!pwd) { toast('Session expired. Please lock and unlock again.', 'error'); return; }
  
  try {
    const payload = await encryptData(STATE.vault, pwd);
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'aegiskeys-vault.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast('Encrypted vault saved to disk', 'success');
  } catch (err) {
    showErrorModal('Failed to save vault: ' + err.message);
  }
};

/* ---------- TEST FUNCTION ---------- */
$('btnTest').onclick = async () => {
  const e = STATE.vault.entries.find(x => x.id === STATE.currentId);
  if (!e) return;

  const area = $('testResultArea');
  area.innerHTML = `<div class="test-result" style="margin-top:16px;"><h4>🔄 Testing connection...</h4><p style="color:var(--text-muted)">Pinging ${esc(e.baseUrl)}...</p></div>`;
  
  $('btnTest').disabled = true;
  $('btnTest').innerHTML = '<span class="spinner"></span> Testing';

  const startTime = performance.now();
  
  try {
    const auth = (e.authHeader || 'Authorization: Bearer <token>').replace('<token>', e.token);
    const [hName, ...hRest] = auth.split(':');
    const headers = { [hName.trim()]: hRest.join(':').trim(), 'Content-Type': 'application/json' };
    
    let url = e.baseUrl.replace(/\/$/, '');
    let opts = { method: 'GET', headers };

    if (e.model) {
      url += '/chat/completions';
      opts.method = 'POST';
      opts.body = JSON.stringify({ model: e.model, messages: [{ role: 'user', content: 'ping' }], max_tokens: 1 });
    } else {
      url += '/models';
    }

    const res = await fetch(url, opts);
    const latency = Math.round(performance.now() - startTime);
    const body = await res.text();

    if (res.ok) {
      area.innerHTML = `
        <div class="test-result success">
          <h4>✅ Connection Successful</h4>
          <div class="kv-grid" style="font-size: 13px;">
            <div class="k">Status</div><div class="v text">${res.status} ${res.statusText}</div>
            <div class="k">Latency</div><div class="v text">${latency} ms</div>
          </div>
        </div>`;
      toast('API connection successful', 'success');
    } else {
      throw new Error(`${res.status} ${res.statusText}\n\n${body.slice(0, 300)}`);
    }
  } catch (err) {
    const latency = Math.round(performance.now() - startTime);
    let msg = err.message;
    let isCors = msg.includes('Failed to fetch') || msg.includes('NetworkError');
    
    let extraHelp = '';
    if (isCors) {
      extraHelp = `<br><br><b>💡 Note:</b> This looks like a CORS (Cross-Origin Resource Sharing) error. Many AI APIs block direct browser requests. Your key is likely fine! Try using the <b>cURL</b> command above in your terminal to verify.`;
    }

    area.innerHTML = `
      <div class="test-result error">
        <h4>❌ Connection Failed</h4>
        <div class="kv-grid" style="font-size: 13px;">
          <div class="k">Latency</div><div class="v text">${latency} ms</div>
          <div class="k">Error</div><div class="v text" style="color: var(--red); white-space: pre-wrap;">${esc(msg)}${extraHelp}</div>
        </div>
      </div>`;
    toast('API test failed', 'error');
  } finally {
    $('btnTest').disabled = false;
    $('btnTest').innerHTML = '🧪 Test';
  }
};

/* ---------- CLIPBOARD ---------- */
async function copyToClipboard(text, successMsg = 'Copied!') {
  try {
    await navigator.clipboard.writeText(text);
    toast(successMsg, 'success');
    
    // Auto-clear sensitive data
    if (text.length > 20) { // Assume long strings are tokens
      setTimeout(async () => {
        try {
          const cur = await navigator.clipboard.readText();
          if (cur === text) await navigator.clipboard.writeText('');
        } catch {}
      }, 30000);
    }
    
    // Update stats if it's a token copy
    const e = STATE.vault.entries.find(x => x.token === text);
    if (e) {
      e.copyCount = (e.copyCount || 0) + 1;
      e.lastUsedAt = now();
    }
  } catch {
    toast('Failed to copy. Check browser permissions.', 'error');
  }
}

/* ---------- INIT ---------- */
$('masterPwd').focus();
</script>
</body>
